services:
  db:
    image: postgres:15-alpine
    container_name: tracking_orders_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      PGPASSFILE: /var/lib/postgresql/.pgpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ~/.pgpass:/var/lib/postgresql/.pgpass:ro
    networks:
      - tracking_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_orders -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cubinez85/tracking-orders:latest
    container_name: tracking_orders_web
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      CREATE_SUPERUSER: ${CREATE_SUPERUSER}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tracking_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tracking_orders_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - ../../logs/nginx:/var/log/nginx
    command: >
       sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - web
    networks:
      - tracking_net
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  tracking_net:
    driver: bridge
